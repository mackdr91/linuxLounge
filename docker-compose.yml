services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: linux-lounge-app
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
